seed: 42
algo: PPO
device: cuda
network:
  mlp:
    units: [512, 256, 128]
  priv_mlp:
    units: [256, 128, 8]

load_path: None

algorithm:
  experiment_name: 'bulb_socket_demo'
  normalize_input: True
  normalize_value: True
  value_bootstrap: True
  num_actors: 8192
  normalize_advantage: True
  gamma: 0.99
  tau: 0.95
  learning_rate: 3e-4
  kl_threshold: 0.02
  horizon_length: 16
  minibatch_size: 32768
  mini_epochs: 3
  clip_value: True
  critic_coef: 4
  entropy_coef: 0.0
  e_clip: 0.2
  bounds_loss_coef: 0.0001
  truncate_grads: True
  grad_norm: 1.0
  save_best_after: 0
  save_frequency: 100
  max_agent_steps: 20000000
  priv_info: True
  priv_info_dim: 11
  priv_info_embed_dim: 8
